<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Jéssica Rayane</title>

		<!-- Preconnect: estabelece conexão antecipada com origens críticas -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://grhljhackmnbbglnbkks.supabase.co" crossorigin />

		<!-- Google Fonts carregado de forma não-bloqueante (media=print + onload trick) -->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" />
		</noscript>
		<meta name="description" content="Bailarina, educadora, coordenadora pedagógica e criadora de comunidade. Explorando dança, leitura e desenvolvimento pessoal." />

		<!-- Open Graph (preview de links no WhatsApp, Instagram, etc) -->
		<meta property="og:title" content="Jéssica Rayane" />
		<meta property="og:description" content="Bailarina, educadora, coordenadora pedagógica e criadora de comunidade." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://jrdancing.com.br/" />
		<meta property="og:locale" content="pt_BR" />

		<!-- Twitter/X Card -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Jéssica Rayane" />
		<meta name="twitter:description" content="Bailarina, educadora, coordenadora pedagógica e criadora de comunidade." />
	</head>
	<body>
		<!-- Redireciona token de recovery do Supabase antes do React carregar -->
		<script>
			(function () {
				var hash = window.location.hash.substring(1);
				var params = new URLSearchParams(hash);
				if (params.get('type') === 'recovery' && params.get('access_token')) {
					history.replaceState(null, '', '/reset-password' + window.location.hash);
				}
			})();
		</script>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
